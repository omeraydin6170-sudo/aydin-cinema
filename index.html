<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AYDIN CİNEMA | Premium v5.0</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- ===== PWA (iPhone Ana Ekrana Ekleme) ===== -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Aydın Cinema">
    <meta name="theme-color" content="#0a0b13">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #07080e;
            --void-2: #0f111a;
            --panel: #171a27;
            --panel-raised: #1e2233;
            --panel-hover: #262b42;
            --line: #2a2e42;
            --marquee: #ffb703;
            --marquee-dim: #a67a1f;
            --marquee-glow: rgba(255, 183, 3, 0.45);
            --hot: #ff5d5d;
            --hot-dim: #c94848;
            --ink: #f4f0e6;
            --dim: #9296ac;
            --dim-2: #5b5f74;
            --mono: 'JetBrains Mono', monospace;
            --display: 'Anton', sans-serif;
            --body-font: 'Inter', sans-serif;
            --nav-h: 64px;
            --bottom-nav-h: 64px;
            --ease: cubic-bezier(.22,.9,.32,1);
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; overflow-x: hidden; width: 100%; scroll-behavior: smooth; }
        body {
            background: var(--void);
            background-image:
                radial-gradient(ellipse 1000px 560px at 50% -8%, rgba(255, 183, 3, 0.10), transparent 60%),
                radial-gradient(ellipse 800px 460px at 92% 4%, rgba(255, 93, 93, 0.07), transparent 60%);
            color: var(--ink);
            font-family: var(--body-font);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden; width: 100%; max-width: 100vw;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
        }
        input, select, button { max-width: 100%; font-family: var(--body-font); }
        a { color: inherit; }
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--marquee-dim); }

        .icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; flex-shrink: 0; }
        .icon.filled { fill: currentColor; stroke: none; }

        button { cursor: pointer; }
        :focus-visible { outline: 2px solid var(--marquee); outline-offset: 2px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
        }

        /* ===== TOP MARQUEE STRIP (signature) ===== */
        .marquee-strip {
            display: flex; justify-content: center; gap: 9px;
            padding: 8px 0 6px; background: var(--void-2);
            border-bottom: 1px solid var(--line);
        }
        .marquee-strip span {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--marquee);
            box-shadow: 0 0 8px 2px var(--marquee-glow);
            animation: bulb-flicker 2.6s ease-in-out infinite;
        }
        .marquee-strip span:nth-child(2n) { animation-delay: 0.35s; }
        .marquee-strip span:nth-child(3n) { animation-delay: 0.7s; }
        .marquee-strip span:nth-child(5n) { animation-delay: 1.1s; }
        @keyframes bulb-flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ===== NAVBAR ===== */
        .navbar {
            position: sticky; top: 0; z-index: 40;
            background: rgba(10, 11, 19, 0.82);
            backdrop-filter: blur(14px) saturate(1.4);
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            border-bottom: 1px solid var(--line);
            padding-top: env(safe-area-inset-top);
        }
        .navbar-inner {
            max-width: 1400px; margin: 0 auto; height: var(--nav-h);
            display: flex; align-items: center; gap: 20px; padding: 0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right));
        }
        .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; cursor: pointer; background: none; border: none; padding: 0; }
        .nav-brand img { width: 34px; height: 34px; border-radius: 8px; filter: drop-shadow(0 0 10px var(--marquee-glow)); }
        .nav-brand span {
            font-family: var(--display); font-weight: 400; letter-spacing: 0.03em;
            font-size: 1.15rem; text-transform: uppercase; color: var(--ink); white-space: nowrap;
        }
        .nav-tabs { display: flex; gap: 4px; margin-left: 8px; }
        .nav-tab {
            background: none; border: none; color: var(--dim); font-weight: 600; font-size: 0.85rem;
            padding: 9px 14px; border-radius: 8px; transition: color .15s, background .15s;
            letter-spacing: 0.01em;
        }
        .nav-tab:hover { color: var(--ink); background: var(--panel); }
        .nav-tab.active { color: var(--marquee); }
        .nav-spacer { flex: 1; }
        .nav-actions { display: flex; align-items: center; gap: 6px; }
        .icon-btn {
            width: 42px; height: 42px; border-radius: 50%; background: transparent; border: 1px solid transparent;
            color: var(--ink); display: flex; align-items: center; justify-content: center;
            transition: background .15s, border-color .15s, transform .15s;
        }
        .icon-btn:hover { background: var(--panel); border-color: var(--line); }
        .icon-btn:active { transform: scale(0.93); }
        .icon-btn.hot { color: var(--hot); }
        .avatar-btn {
            width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--marquee);
            background: var(--panel-raised); color: var(--marquee); font-weight: 800; font-size: 0.8rem;
            display: flex; align-items: center; justify-content: center; font-family: var(--mono);
        }
        @media (max-width: 780px) { .nav-tabs { display: none; } }

        /* ===== LAYOUT ===== */
        .page { max-width: 1400px; margin: 0 auto; padding: 26px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
        @media (max-width: 780px) { .page { padding-bottom: calc(var(--bottom-nav-h) + 28px); } }

        .eyebrow-line { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .eyebrow-line .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 8px 2px rgba(255,93,93,.6); }
        .eyebrow-line span { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.28em; color: var(--dim); text-transform: uppercase; }

        /* ===== HERO / PLAYER ===== */
        .hero { margin-bottom: 34px; }
        .player-shell {
            position: relative; width: 100%; aspect-ratio: 16/9; background: #000;
            border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
            box-shadow: 0 30px 70px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,183,3,0.04);
        }
        .player-shell iframe { width: 100%; height: 100%; border: none; display: block; }
        .player-placeholder {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; text-align: center; padding: 24px;
            background:
                radial-gradient(ellipse 500px 300px at 50% 30%, rgba(255,183,3,0.10), transparent 70%),
                linear-gradient(160deg, #14151f, #0a0b12 70%);
            transition: opacity .3s var(--ease);
        }
        .player-placeholder.hidden { opacity: 0; pointer-events: none; }
        .player-placeholder .ph-icon {
            width: 68px; height: 68px; border-radius: 50%; background: var(--panel-raised);
            border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--marquee);
        }
        .player-placeholder .ph-icon .icon { width: 28px; height: 28px; }
        .player-placeholder h3 { font-family: var(--display); font-weight: 400; font-size: 1.3rem; letter-spacing: 0.02em; margin: 0; color: var(--ink); text-transform: uppercase; }
        .player-placeholder p { color: var(--dim); font-size: 0.85rem; margin: 0; max-width: 320px; }
        .player-info-bar {
            position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 22px 16px;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.85) 70%);
            display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
            opacity: 0; transform: translateY(8px); transition: opacity .3s var(--ease), transform .3s var(--ease);
            pointer-events: none;
        }
        .player-info-bar.visible { opacity: 1; transform: translateY(0); }
        .player-info-title { font-family: var(--display); font-weight: 400; font-size: clamp(1.1rem, 2.4vw, 1.6rem); letter-spacing: 0.01em; color: #fff; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
        .player-info-meta { font-family: var(--mono); font-size: 0.72rem; color: var(--marquee); margin-top: 4px; letter-spacing: 0.03em; }
        .live-chip {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255,93,93,0.15); color: var(--hot);
            font-family: var(--mono); font-size: 0.65rem; padding: 5px 10px; border-radius: 20px; letter-spacing: 0.08em;
            flex-shrink: 0; border: 1px solid rgba(255,93,93,0.3);
        }
        .live-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--hot); animation: bulb-flicker 1.4s ease-in-out infinite; }

        /* ===== CONTROL BAR (ticket booth) ===== */
        .control-bar {
            margin-top: 16px;
            background: linear-gradient(180deg, var(--panel), var(--panel-raised));
            border: 1px solid var(--line); border-top: 2px solid var(--marquee);
            border-radius: 14px; padding: 16px;
            display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
            box-shadow: 0 14px 30px rgba(0,0,0,0.4);
        }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; padding-left: 2px; }
        .field.grow { flex: 1 1 220px; }
        .field.name-field { flex: 1 1 240px; }
        .field.id-field { flex: 1 1 170px; }
        .field.type-field { flex: 0 1 130px; }
        input, select {
            padding: 12px 13px; border-radius: 9px; border: 1px solid var(--line);
            background: var(--void-2); color: var(--ink); outline: none;
            font-family: var(--body-font); font-size: 16px;
            min-height: 46px; transition: border-color 0.15s, box-shadow .15s;
        }
        input:focus, select:focus { border-color: var(--marquee); box-shadow: 0 0 0 3px rgba(255,183,3,0.12); }
        input::placeholder { color: var(--dim-2); }
        .tv-controls { display: none; gap: 8px; align-items: flex-end; }
        .tv-controls .field { flex: 0 0 64px; }
        .tv-controls input { text-align: center; padding-left: 4px; padding-right: 4px; }

        button { border: none; border-radius: 9px; font-family: var(--body-font); }
        .btn-play {
            padding: 13px 28px; min-height: 46px;
            background: linear-gradient(180deg, #ffc63d, var(--marquee)); color: #14110a; border: none;
            font-weight: 800; font-size: 0.88rem; text-transform: uppercase; letter-spacing: 0.04em;
            display: flex; align-items: center; gap: 8px;
            transition: transform 0.15s, box-shadow 0.15s, filter .15s;
            box-shadow: 0 8px 20px rgba(255,183,3,0.25);
        }
        .btn-play .icon { width: 16px; height: 16px; }
        .btn-play:hover { filter: brightness(1.08); box-shadow: 0 10px 26px rgba(255,183,3,0.35); }
        .btn-play:active { transform: scale(0.96); }

        /* ===== SECTION HEADS ===== */
        .section { margin-top: 42px; }
        .section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; }
        .section-head h2 {
            margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.3rem;
            letter-spacing: 0.02em; color: var(--ink); text-transform: uppercase; display: flex; align-items: center; gap: 10px;
        }
        .section-head h2 .bar { width: 4px; height: 20px; background: var(--marquee); border-radius: 3px; display: inline-block; }
        .clear-btn {
            background: none; border: 1px solid var(--line); color: var(--dim);
            font-size: 0.72rem; padding: 9px 14px; min-height: 38px; font-weight: 600; border-radius: 8px;
            display: flex; align-items: center; gap: 6px;
        }
        .clear-btn:hover { background: var(--panel-raised); color: var(--hot); border-color: var(--hot-dim); }
        .clear-btn:active { transform: scale(0.97); }
        .clear-btn .icon { width: 14px; height: 14px; }

        /* ===== CAROUSEL / POSTER CARDS ===== */
        .carousel-wrap { position: relative; }
        .carousel-track {
            display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity;
            padding: 4px 2px 14px; scrollbar-width: thin;
        }
        .carousel-arrow {
            position: absolute; top: 0; bottom: 14px; width: 46px; z-index: 5;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(90deg, var(--void), transparent);
            color: var(--ink); border: none; opacity: 0; transition: opacity .2s;
        }
        .carousel-wrap:hover .carousel-arrow { opacity: 1; }
        .carousel-arrow.right { right: 0; left: auto; background: linear-gradient(270deg, var(--void), transparent); }
        .carousel-arrow .icon { width: 26px; height: 26px; }
        @media (hover: none) { .carousel-arrow { display: none; } }

        .poster-card {
            flex: 0 0 148px; scroll-snap-align: start; cursor: pointer; position: relative;
            border-radius: 12px; overflow: hidden; background: var(--panel-raised);
            border: 1px solid var(--line); transition: transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s;
        }
        .poster-card:hover, .poster-card:focus-visible { transform: translateY(-6px) scale(1.035); box-shadow: 0 18px 34px rgba(0,0,0,0.55); border-color: var(--marquee-dim); z-index: 2; }
        .poster-card .poster-img-wrap { width: 100%; aspect-ratio: 2/3; position: relative; background: var(--panel-raised); overflow: hidden; }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .poster-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--dim-2); background: linear-gradient(160deg, var(--panel-raised), var(--void-2)); }
        .poster-placeholder .icon { width: 34px; height: 34px; }
        .poster-badge {
            position: absolute; top: 8px; left: 8px; font-family: var(--mono); font-size: 0.6rem; font-weight: 600;
            padding: 4px 7px; border-radius: 5px; letter-spacing: 0.05em; backdrop-filter: blur(4px);
        }
        .poster-badge.movie { background: rgba(255,183,3,0.85); color: #14110a; }
        .poster-badge.tv { background: rgba(255,93,93,0.88); color: #1a0808; }
        .poster-card .poster-overlay {
            position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 9px 9px;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.92));
        }
        .poster-card .poster-title { font-size: 0.78rem; font-weight: 700; color: #fff; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .poster-card .poster-meta { font-size: 0.65rem; color: var(--marquee); margin-top: 3px; font-family: var(--mono); }
        .poster-card .poster-play {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.7); width: 40px; height: 40px;
            border-radius: 50%; background: rgba(255,183,3,0.92); color: #14110a; display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity .2s, transform .2s;
        }
        .poster-card:hover .poster-play { opacity: 1; transform: translate(-50%,-50%) scale(1); }
        .poster-card .poster-play .icon { width: 17px; height: 17px; margin-left: 2px; }

        /* ===== RECOMMENDATIONS (Watchmode) ===== */
        .recommend-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
        .recommend-controls select { min-width: 140px; flex: 1 1 140px; }
        .recommend-controls .rm-go-btn { flex: 0 0 auto; width: auto; padding: 12px 20px; white-space: nowrap; }
        .recommend-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px;
        }
        .recommend-loadmore { display: flex; justify-content: center; margin-top: 20px; }
        .recommend-loadmore button { width: auto; padding: 12px 24px; }
        .recommend-status {
            color: var(--dim); font-size: 0.85rem; padding: 40px 10px; text-align: center;
            grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .recommend-status .icon { width: 28px; height: 28px; color: var(--dim-2); }
        .recommend-status.error { color: var(--hot); }
        .recommend-status a { color: var(--marquee); }
        .rm-score {
            position: absolute; top: 8px; right: 8px; font-family: var(--mono); font-size: 0.62rem; font-weight: 700;
            padding: 3px 6px; border-radius: 5px; background: rgba(7,8,14,0.78); color: var(--marquee);
            border: 1px solid rgba(255,183,3,0.35);
        }

        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            padding: 50px 20px; color: var(--dim); text-align: center;
            background: var(--panel); border: 1px dashed var(--line); border-radius: 14px;
        }
        .empty-state .icon { width: 34px; height: 34px; color: var(--dim-2); }
        .empty-state strong { color: var(--ink); font-size: 0.95rem; }
        .empty-state span { font-size: 0.8rem; }

        /* ===== OVERLAYS (search / account / episodes) ===== */
        .overlay-backdrop {
            position: fixed; inset: 0; z-index: 100; background: rgba(6,7,12,0.72);
            backdrop-filter: blur(6px); display: none; align-items: stretch; justify-content: flex-end;
            opacity: 0; transition: opacity .25s var(--ease);
        }
        .overlay-backdrop.open { display: flex; opacity: 1; }
        .overlay-panel {
            width: 420px; max-width: 100%; height: 100%; background: var(--void-2);
            border-left: 1px solid var(--line); display: flex; flex-direction: column;
            transform: translateX(24px); transition: transform .28s var(--ease);
            padding-top: env(safe-area-inset-top);
        }
        .overlay-backdrop.open .overlay-panel { transform: translateX(0); }
        .overlay-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
        .overlay-header h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.05rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink); display: flex; align-items: center; gap: 9px; }
        .overlay-body { flex: 1; overflow-y: auto; padding: 20px; }
        @media (max-width: 600px) {
            .overlay-panel { width: 100%; }
        }

        /* centered modal variant (episode picker) */
        .overlay-backdrop.center { justify-content: center; align-items: center; padding: 20px; }
        .modal-panel {
            width: 440px; max-width: 100%; max-height: 80vh; background: var(--panel);
            border: 1px solid var(--line); border-top: 3px solid var(--hot); border-radius: 16px;
            display: flex; flex-direction: column; overflow: hidden;
            transform: translateY(16px) scale(0.98); transition: transform .25s var(--ease);
            box-shadow: 0 30px 70px rgba(0,0,0,0.6);
        }
        .overlay-backdrop.open .modal-panel { transform: translateY(0) scale(1); }

        /* search panel content */
        .search-field-wrap { position: relative; margin-bottom: 6px; }
        .search-field-wrap .icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--dim); }
        .search-field-wrap input { width: 100%; padding-left: 38px; }
        .search-status { color: var(--dim); font-size: 0.8rem; text-align: center; padding: 14px 0; }
        .search-status a { color: var(--marquee); }
        .api-key-hint { font-size: 0.72rem; color: var(--dim); padding: 8px 0 14px; display: flex; align-items: center; gap: 6px; }
        .api-key-hint a { color: var(--marquee); cursor: pointer; text-decoration: underline; }
        .api-key-hint .dot-on { width: 6px; height: 6px; border-radius: 50%; background: #4caf50; box-shadow: 0 0 6px 1px rgba(76,175,80,.6); flex-shrink: 0; }

        .imdb-results { display: flex; flex-direction: column; gap: 10px; }
        .imdb-result-item {
            display: flex; gap: 10px; align-items: center; background: var(--panel); border-radius: 10px;
            padding: 10px; border: 1px solid var(--line); transition: 0.15s;
        }
        .imdb-result-item:hover { background: var(--panel-raised); }
        .imdb-result-item img { width: 40px; height: 56px; object-fit: cover; border-radius: 4px; background: var(--panel-raised); flex-shrink: 0; }
        .imdb-result-info { flex: 1; min-width: 0; }
        .imdb-result-title { font-size: 0.85rem; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .imdb-result-meta { font-size: 0.7rem; color: var(--dim); }
        .imdb-result-id { font-size: 0.7rem; color: var(--marquee); font-family: var(--mono); }
        .imdb-result-actions { display: flex; flex-direction: column; gap: 6px; }
        .imdb-mini-btn {
            padding: 8px 10px; font-size: 0.65rem; border-radius: 6px; text-transform: none;
            background: var(--panel-raised); color: var(--ink); white-space: nowrap; min-height: 32px; font-weight: 600; border: 1px solid var(--line);
        }
        .imdb-mini-btn:hover { background: var(--marquee); color: #14110a; border-color: var(--marquee); }
        .imdb-mini-btn.copied { background: #2e7d32 !important; color: #fff !important; border-color: #2e7d32 !important; }

        .divider { text-align: center; color: var(--dim-2); font-size: 0.68rem; margin: 18px 0; text-transform: uppercase; letter-spacing: 0.15em; position: relative; }

    <!-- ================= FIREBASE (Hesap + Bulut Senkronizasyonu) =================
         AŞAĞIYA KENDİ FIREBASE PROJENİN "firebaseConfig" BİLGİLERİNİ YAPIŞTIR.
         Firebase Console > Proje Ayarları > Genel > "Web uygulamaların" bölümünden alınır.
    -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
            signOut, onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore, doc, getDoc, setDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ↓↓↓ BURAYI KENDİ FIREBASE CONFIG'İNLE DEĞİŞTİR ↓↓↓
        const firebaseConfig = {
            apiKey: "AIzaSyDjuKtPKa5btEeI4rmcEG45HEZNjULMYFY",
            authDomain: "aydincinema-28918.firebaseapp.com",
            projectId: "aydincinema-28918",
            storageBucket: "aydincinema-28918.firebasestorage.app",
            messagingSenderId: "567994850263",
            appId: "1:567994850263:web:25e5fdca48d8f2691c0992"
        };
        // ↑↑↑ BURAYI KENDİ FIREBASE CONFIG'İNLE DEĞİŞTİR ↑↑↑

        let app = null, auth = null, db = null, firebaseReady = false;
        try {
            if (!firebaseConfig.apiKey.startsWith("BURAYA_")) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                firebaseReady = true;
            }
        } catch (e) {
            console.error("Firebase başlatılamadı:", e);
        }

        // Ana (non-module) script'in kullanabilmesi için köprü fonksiyonlar window'a bağlanıyor.
        window.firebaseBridge = {
            ready: firebaseReady,

            register: async (email, password) => {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                return cred.user;
            },
            login: async (email, password) => {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                return cred.user;
            },
            logout: async () => signOut(auth),

            // Kullanıcının Firestore'daki geçmiş verisini okur. Yoksa null döner.
            loadHistory: async (uid) => {
                const snap = await getDoc(doc(db, "users", uid));
                if (snap.exists() && Array.isArray(snap.data().history)) return snap.data().history;
                return null;
            },
            // Kullanıcının Firestore'daki geçmiş verisini yazar.
            saveHistory: async (uid, historyArray) => {
                await setDoc(doc(db, "users", uid), { history: historyArray }, { merge: true });
            },

            // Oturum durumu değiştiğinde (giriş/çıkış/sayfa yenileme) çalışacak callback'i kaydeder.
            onAuthChange: (callback) => {
                if (!firebaseReady) { callback(null); return; }
                onAuthStateChanged(auth, (user) => callback(user));
            }
        };

        if (!firebaseReady) {
            // Config henüz doldurulmadıysa ana script yine de çalışsın, sadece bulut senkronu pasif kalsın.
            window.dispatchEvent(new Event('firebaseBridgeReady'));
        } else {
            window.dispatchEvent(new Event('firebaseBridgeReady'));
        }
    </script>

    <script>
        /* ================= UI: NAV / SCROLL / OVERLAYS ================= */
        function scrollToSection(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
            setActiveNav(id);
        }
        function setActiveNav(id) {
            document.getElementById('navHomeTab').classList.toggle('active', id === 'heroSection');
            document.getElementById('navHistoryTab').classList.toggle('active', id === 'historySection');
            document.getElementById('navRecommendTab').classList.toggle('active', id === 'recommendSection');
            document.getElementById('bnHome').classList.toggle('active', id === 'heroSection');
            document.getElementById('bnHistory').classList.toggle('active', id === 'historySection');
            document.getElementById('bnRecommend').classList.toggle('active', id === 'recommendSection');
        }
        (function () {
            const hero = document.getElementById('heroSection');
            const hist = document.getElementById('historySection');
            const rec = document.getElementById('recommendSection');
            const io = new IntersectionObserver((entries) => {
                entries.forEach(en => { if (en.isIntersecting) setActiveNav(en.target.id); });
            }, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
            io.observe(hero); io.observe(hist); io.observe(rec);
        })();

        function openOverlay(id) {
            const el = document.getElementById(id);
            el.classList.add('open');
            document.body.style.overflow = 'hidden';
            if (id === 'searchOverlay') setTimeout(() => document.getElementById('imdbSearchInput').focus(), 260);
        }
        function closeOverlay(id) {
            document.getElementById(id).classList.remove('open');
            const anyOpen = document.querySelector('.overlay-backdrop.open');
            if (!anyOpen) document.body.style.overflow = '';
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.overlay-backdrop.open').forEach(el => closeOverlay(el.id));
            }
        });

        function scrollCarousel(dir) {
            const track = document.getElementById('historyTrack');
            track.scrollBy({ left: dir * (track.clientWidth * 0.8), behavior: 'smooth' });
        }

        /* ================= HESAP + BULUT SENKRONİZASYONU ================= */
        let currentUser = null;
        let cloudSyncBusy = false;

        window.addEventListener('firebaseBridgeReady', initAccountSystem);
        // Bridge script'i bu ana script'ten önce zaten yüklenip event'i tetiklemiş olabilir.
        if (window.firebaseBridge) initAccountSystem();

        function initAccountSystem() {
            if (!window.firebaseBridge || !window.firebaseBridge.ready) {
                renderAccountPanel(); // config girilmemiş, sadece bilgi mesajı göster
                return;
            }
            window.firebaseBridge.onAuthChange(async (user) => {
                currentUser = user;

        async function handleAuth(mode) {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const errorBox = document.getElementById('authError');
            errorBox.textContent = '';

            if (!email || !password) {
                errorBox.textContent = 'E-posta ve şifre gerekli.';
                return;

            try {
                if (mode === 'register') {
                    await window.firebaseBridge.register(email, password);
                } else {
                    await window.firebaseBridge.login(email, password);
                }
                // onAuthChange dinleyicisi otomatik tetiklenip paneli güncelleyecek
            } catch (err) {
                errorBox.textContent = translateFirebaseError(err.code || err.message);
            }

        function translateFirebaseError(code) {
            const map = {
                'auth/email-already-in-use': 'Bu e-posta zaten kayıtlı, Giriş Yap\'ı dene.',
                'auth/invalid-email': 'Geçersiz e-posta adresi.',
                'auth/weak-password': 'Şifre en az 6 karakter olmalı.',
                'auth/wrong-password': 'Şifre hatalı.',
                'auth/user-not-found': 'Bu e-posta ile kayıtlı hesap bulunamadı.',
                'auth/invalid-credential': 'E-posta veya şifre hatalı.',
                'auth/too-many-requests': 'Çok fazla deneme yapıldı, biraz bekleyin.'
            };
            return map[code] || 'Bir hata oluştu, tekrar deneyin.';
        }

        // Girişten hemen sonra çalışır: buluttaki geçmiş varsa onu esas alır,
        // yoksa (ilk senkron) mevcut yerel geçmişi buluta yükler.
        async function pullHistoryFromCloud() {
            if (!currentUser) return;
            try {
                const cloudHistory = await window.firebaseBridge.loadHistory(currentUser.uid);
                if (cloudHistory) {
                    localStorage.setItem('cinemaHistory', JSON.stringify(cloudHistory));
                    renderHistory();
                } else {
                    // Bulutta hiç kayıt yok, yerelde varsa ilk kez buluta gönder
                    const localHistory = JSON.parse(localStorage.getItem('cinemaHistory')) || [];
                    if (localHistory.length > 0) {
                        await window.firebaseBridge.saveHistory(currentUser.uid, localHistory);
                    }
                }
            } catch (err) {
                console.error('Bulut geçmişi alınamadı:', err);
            }
        }

        // Yerel geçmiş her değiştiğinde (izleme, silme) giriş yapılmışsa buluta da yazar.
        async function syncHistoryToCloud() {
            if (!currentUser || !window.firebaseBridge || cloudSyncBusy) return;
            cloudSyncBusy = true;
            try {
                const localHistory = JSON.parse(localStorage.getItem('cinemaHistory')) || [];
                await window.firebaseBridge.saveHistory(currentUser.uid, localHistory);

                cloudSyncBusy = false;
            }
        }

        async function loadMedia() {

            const s = document.getElementById('season').value;

            if (!id) { alert("Lütfen IMDb ID girin."); return; }

            // Oynatmayı hemen başlat, poster çözümlemesi izlemeyi bekletmesin
            let finalUrl = "";
            if (type === 'movie') {
                finalUrl = `https://vaplayer.ru/embed/movie/${id}`;

        // Varsayılan olarak gömülü OMDb API anahtarı. Kullanıcı kendi anahtarını girerse
        // (localStorage'a kaydedilir) o öncelikli olur; girmezse bu varsayılan kullanılır.
        const DEFAULT_OMDB_KEY = '7c2550ff';
        function getOmdbApiKey() {
            return localStorage.getItem('omdbApiKey') || DEFAULT_OMDB_KEY;
        }

        // IMDb ID'sinden kapak resmi (poster) çözer: önce OMDb'yi dener, olmazsa IMDb'nin
        // öneri servisini (proxy zinciriyle) dener. Bulamazsa boş döner (placeholder gösterilir).
        async function fetchPosterForId(id) {
            const apiKey = getOmdbApiKey();
            try {
                const res = await fetch(`https://www.omdbapi.com/?apikey=${encodeURIComponent(apiKey)}&i=${encodeURIComponent(id)}`);
                const data = await res.json();
                if (data && data.Poster && data.Poster !== 'N/A') return data.Poster;
            } catch (e) { /* yavaş moda düş */ }
            try {
                const text = await proxyFetchText(`https://v2.sg.media-imdb.com/suggestion/t/${encodeURIComponent(id)}.json`);
                const data = JSON.parse(text);
                const match = (data.d || []).find(x => x.id === id);
                if (match && match.i && match.i.imageUrl) return match.i.imageUrl;
            } catch (e) { /* poster bulunamadı */ }
            return '';
        }

        function saveToHistory(item) {
            let history = JSON.parse(localStorage.getItem('cinemaHistory')) || [];
            const existingIndex = history.findIndex(h => h.id === item.id && h.type === item.type);

            if (item.type === 'tv') {
                if (existingIndex !== -1) {
                    const group = history[existingIndex];
                    group.episodes = (group.episodes || []).filter(ep => !(ep.s === item.s && ep.e === item.e));
                    group.episodes.unshift({ s: item.s, e: item.e, date: item.date });
                    group.s = item.s;
                    group.e = item.e;
                    group.date = item.date;
                    group.name = item.name;
                    if (item.poster) group.poster = item.poster;
                    history.splice(existingIndex, 1);
                    history.unshift(group);
                } else {
                    history.unshift({
                        name: item.name, type: item.type, id: item.id,
                        s: item.s, e: item.e, date: item.date, poster: item.poster || '',
                        episodes: [{ s: item.s, e: item.e, date: item.date }]
                    });
                }
            } else {
                if (existingIndex !== -1) history.splice(existingIndex, 1);
                history.unshift({ name: item.name, type: item.type, id: item.id, date: item.date, poster: item.poster || '' });
            }

            localStorage.setItem('cinemaHistory', JSON.stringify(history.slice(0, 20)));
            renderHistory();
            syncHistoryToCloud();
        }

                    <div class="poster-img-wrap">
                        ${posterInner}
                        <span class="poster-badge ${isTv ? 'tv' : 'movie'}">${isTv ? 'DİZİ' : 'FİLM'}</span>

        async function fetchOmdbSearch(query, apiKey) {
            const res = await fetch(`https://www.omdbapi.com/?apikey=${encodeURIComponent(apiKey)}&s=${encodeURIComponent(query)}`);
            const data = await res.json();
            if (data.Response === 'False') {
                if ((data.Error || '').toLowerCase().includes('invalid api key')) {
                    const err = new Error('invalid key'); err.invalidKey = true; throw err;
                }
                return [];
            }
            return data.Search || [];
        }

        async function proxyFetchText(url, timeoutMs = 4000) {
            const withTimeout = (getPromise) => {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                return getPromise(controller.signal).finally(() => clearTimeout(timer));
            };

            const attempts = [
                withTimeout(signal => fetch(url, { signal }).then(r => { if (!r.ok) throw new Error('bad'); return r.text(); })),
                withTimeout(signal => fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, { signal }).then(r => { if (!r.ok) throw new Error('bad'); return r.text(); })),
                withTimeout(signal => fetch(`https://corsproxy.io/?url=${encodeURIComponent(url)}`, { signal }).then(r => { if (!r.ok) throw new Error('bad'); return r.text(); })),
                withTimeout(signal => fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, { signal }).then(r => { if (!r.ok) throw new Error('bad'); return r.json(); }).then(w => w.contents))
            ];

            try {
                return await Promise.any(attempts);
            } catch (e) {
                throw new Error('Tüm bağlantı yöntemleri başarısız oldu');
            }
        }

        async function fetchImdbSuggestions(query) {
            const firstChar = (query.match(/[a-zA-Z0-9]/) || ['a'])[0].toLowerCase();
            const targetUrl = `https://v2.sg.media-imdb.com/suggestion/${firstChar}/${encodeURIComponent(query)}.json`;
            const text = await proxyFetchText(targetUrl);
            const data = JSON.parse(text);
            if (!data || !Array.isArray(data.d)) throw new Error('Geçersiz yanıt');
            return data;
        }

        async function fetchImdbViaWebSearch(query) {
            const searchUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent('site:imdb.com/title ' + query)}`;
            const html = await proxyFetchText(searchUrl);

            const results = [];
            const seen = new Set();
            const anchorRegex = /<a[^>]+class="result__a"[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/g;
            let m;
            while ((m = anchorRegex.exec(html)) !== null) {
                let href = m[1];
                let title = m[2].replace(/<[^>]+>/g, '').trim()
                    .replace(/&amp;/g, '&').replace(/&#x27;/g, "'").replace(/&quot;/g, '"');

                const uddgMatch = href.match(/uddg=([^&]+)/);
                if (uddgMatch) {
                    try { href = decodeURIComponent(uddgMatch[1]); } catch (e) { }
                }

                const ttMatch = href.match(/imdb\.com\/title\/(tt\d{6,9})/);
                if (ttMatch && !seen.has(ttMatch[1])) {
                    seen.add(ttMatch[1]);
                    results.push({ id: ttMatch[1], title: title || query });
                }
            }
            return results;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function performImdbSearch(query) {
            const mySeq = ++imdbSearchSeq;
            const resultsBox = document.getElementById('imdbResults');
            const apiKey = getOmdbApiKey();

            try {
                const results = await fetchOmdbSearch(query, apiKey);
                if (mySeq !== imdbSearchSeq) return;
                if (results.length > 0) {
                    renderOmdbResults(results, resultsBox);
                    return;
                }
                resultsBox.innerHTML = `<div class="search-status">Sonuç bulunamadı.</div>`;
                return;
            } catch (err) {
                if (err && err.invalidKey && localStorage.getItem('omdbApiKey')) {
                    // Sadece kullanıcının kendi eklediği özel anahtar geçersizse temizle, varsayılana dön
                    localStorage.removeItem('omdbApiKey');
                    setupApiKeyHint();
                    resultsBox.innerHTML = `<div class="search-status">Özel anahtar geçersiz, varsayılana dönüldü. Tekrar yazın.</div>`;
                    return;
                }
                // apiKey tamamen başarısızsa (ağ sorunu vb.) yavaş moda düş
            }

            try {
                const data = await fetchImdbSuggestions(query);
                if (mySeq !== imdbSearchSeq) return;
                const titles = (data.d || []).filter(x => x.id && x.id.startsWith('tt'));
                if (titles.length > 0) {
                    renderImdbSuggestionResults(titles, resultsBox);
                    return;
                }
            } catch (err) { }

            if (mySeq !== imdbSearchSeq) return;
            resultsBox.innerHTML = `<div class="search-status">Web üzerinden aranıyor...</div>`;

            try {
                const webResults = await fetchImdbViaWebSearch(query);
                if (mySeq !== imdbSearchSeq) return;
                if (webResults.length === 0) throw new Error('sonuç yok');
                renderWebSearchResults(webResults, resultsBox);
            } catch (err2) {
                if (mySeq !== imdbSearchSeq) return;
                resultsBox.innerHTML = `<div class="search-status">
                    Arama şu an yanıt vermiyor.<br>
                    <a href="https://www.imdb.com/find/?q=${encodeURIComponent(query)}" target="_blank" rel="noopener">IMDb'de aç →</a>
                    ve linki aşağıya yapıştır.
                </div>`;
            }
        }

        function renderImdbSuggestionResults(titles, resultsBox) {
            resultsBox.innerHTML = "";
            titles.slice(0, 10).forEach(t => {
                const isTv = (t.qid || '').toLowerCase().includes('series') || (t.qid || '').toLowerCase().includes('episode');
                const year = t.y ? ` (${t.y})` : '';
                const typeLabel = t.q || (isTv ? 'Dizi' : 'Film');
                const poster = (t.i && t.i.imageUrl) ? t.i.imageUrl : '';

                const item = document.createElement('div');
                item.className = 'imdb-result-item';
                item.innerHTML = `
                    ${poster ? `<img src="${poster}" alt="">` : `<div style="width:40px;height:56px;background:var(--panel-raised);border-radius:4px;flex-shrink:0;"></div>`}
                    <div class="imdb-result-info">
                        <div class="imdb-result-title">${escapeHtml(t.l)}${year}</div>
                        <div class="imdb-result-meta">${escapeHtml(typeLabel)}</div>
                        <div class="imdb-result-id">${t.id}</div>
                    </div>
                    <div class="imdb-result-actions">
                        <button class="imdb-mini-btn" data-action="use">Kullan</button>
                        <button class="imdb-mini-btn" data-action="copy">Kopyala</button>
                    </div>
                `;
                item.querySelector('[data-action="use"]').onclick = () => {
                    document.getElementById('mName').value = t.l;
                    document.getElementById('mType').value = isTv ? 'tv' : 'movie';
                    document.getElementById('mId').value = t.id;
                    document.getElementById('mPoster').value = poster || '';
                    updateUI();
                    closeOverlay('searchOverlay');
                    scrollToSection('heroSection');
                };
                item.querySelector('[data-action="copy"]').onclick = (evt) => copyToClipboard(t.id, evt.target);
                resultsBox.appendChild(item);
            });
        }

        function renderWebSearchResults(results, resultsBox) {
            resultsBox.innerHTML = `<div class="search-status" style="padding:4px 0 10px 0;">Web aramasından bulundu:</div>`;
            results.slice(0, 10).forEach(r => {
                const item = document.createElement('div');
                item.className = 'imdb-result-item';
                item.innerHTML = `
                    <div style="width:40px;height:56px;background:var(--panel-raised);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">🎬</div>
                    <div class="imdb-result-info">
                        <div class="imdb-result-title">${escapeHtml(r.title)}</div>
                        <div class="imdb-result-meta">Tür otomatik algılanamadı</div>
                        <div class="imdb-result-id">${r.id}</div>
                    </div>
                    <div class="imdb-result-actions">
                        <button class="imdb-mini-btn" data-action="use">Kullan</button>
                        <button class="imdb-mini-btn" data-action="copy">Kopyala</button>
                    </div>
                `;
                item.querySelector('[data-action="use"]').onclick = () => {
                    document.getElementById('mName').value = r.title;
                    document.getElementById('mId').value = r.id;
                    document.getElementById('mPoster').value = '';
                    updateUI();
                    closeOverlay('searchOverlay');
                    scrollToSection('heroSection');
                };
                item.querySelector('[data-action="copy"]').onclick = (evt) => copyToClipboard(r.id, evt.target);
                resultsBox.appendChild(item);
            });
        }

        function extractIdFromUrl() {
            const raw = document.getElementById('imdbUrlInput').value.trim();
            const resultBox = document.getElementById('urlExtractResult');
            const match = raw.match(/tt\d{6,9}/);

            if (!match) {
                resultBox.innerHTML = `<span style="color:#ff5d5d; font-size:0.8rem;">Geçerli bir IMDb ID/linki bulunamadı.</span>`;
                return;
            }

            const id = match[0];
            resultBox.innerHTML = `
                <span class="imdb-result-id" style="font-size:0.9rem;">${id}</span>
                <div style="display:flex; gap:6px;">
                    <button class="imdb-mini-btn" data-action="use">Kullan</button>
                    <button class="imdb-mini-btn" data-action="copy">Kopyala</button>
                </div>
            `;
            resultBox.querySelector('[data-action="use"]').onclick = () => {
                document.getElementById('mId').value = id;
            };
            resultBox.querySelector('[data-action="copy"]').onclick = (evt) => copyToClipboard(id, evt.target);
        }

        function copyToClipboard(text, btnEl) {
            const done = () => {
                const original = btnEl.textContent;
                btnEl.textContent = "✓ Kopyalandı";
                btnEl.classList.add('copied');
                setTimeout(() => { btnEl.textContent = original; btnEl.classList.remove('copied'); }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
            } else {
                fallbackCopy(text, done);
            }
        }

        function fallbackCopy(text, done) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); done(); } catch (e) {}
            document.body.removeChild(ta);
        }

        /* ================= ÖNERİLER (Watchmode API) =================
           Watchmode ücretsiz bir API anahtarı gerektirir:
           https://api.watchmode.com/requestApiKey
           Anahtar bu cihazda localStorage'a kaydedilir, sunucuya gönderilmez.
        */
        const WATCHMODE_BASE = 'https://api.watchmode.com/v1';
        let rmPage = 1;
        let rmTotalPages = 1;
        let rmLoading = false;

        function getWatchmodeApiKey() {
            return localStorage.getItem('watchmodeApiKey') || '';
        }

        function setupWatchmodeApiKeyHint() {
            const hint = document.getElementById('rmApiKeyHint');
            if (!hint) return;
            const key = getWatchmodeApiKey();
            if (key) {
                hint.innerHTML = `<span class="dot-on"></span>Watchmode anahtarı tanımlı · <a href="#" id="rmChangeKeyLink">değiştir</a>`;
            } else {
                hint.innerHTML = `Öneri motoru için ücretsiz bir Watchmode API anahtarı gerekir · <a href="#" id="rmChangeKeyLink">anahtar gir</a> · <a href="https://api.watchmode.com/requestApiKey" target="_blank" rel="noopener">ücretsiz anahtar al →</a>`;
            }
            const link = document.getElementById('rmChangeKeyLink');
            if (link) link.onclick = (e) => { e.preventDefault(); promptForWatchmodeApiKey(); };
        }

        function promptForWatchmodeApiKey() {
            const current = getWatchmodeApiKey();
            const key = window.prompt(
                "Watchmode API anahtarınızı girin.\n\nÜcretsiz anahtar (kredi kartı gerekmez): https://api.watchmode.com/requestApiKey\n\n(Boş bırakıp Tamam'a basarsanız anahtar silinir)",
                current
            );
            if (key === null) return;
            if (key.trim() === '') localStorage.removeItem('watchmodeApiKey');
            else localStorage.setItem('watchmodeApiKey', key.trim());
            setupWatchmodeApiKeyHint();
        }

        // Watchmode isteklerini önce doğrudan, olmazsa mevcut CORS proxy zinciri üzerinden dener.
        async function watchmodeFetchJson(path, params) {
            const apiKey = getWatchmodeApiKey();
            if (!apiKey) {
                const err = new Error('no-key'); err.noKey = true; throw err;
            }
            const usp = new URLSearchParams(Object.assign({ apiKey }, params || {}));
            const url = `${WATCHMODE_BASE}${path}?${usp.toString()}`;

            try {
                const res = await fetch(url);
                if (res.ok) return await res.json();
                if (res.status === 401 || res.status === 403) {
                    const err = new Error('invalid-key'); err.invalidKey = true; throw err;
                }
                throw new Error('bad-status');
            } catch (directErr) {
                if (directErr.invalidKey) throw directErr;
                // Doğrudan istek CORS ya da ağ hatasına takıldıysa, proxy zincirine düş.
                const text = await proxyFetchText(url);
                return JSON.parse(text);
            }
        }

        async function loadWatchmodeGenres() {
            const select = document.getElementById('rmGenre');
            if (!select || !getWatchmodeApiKey()) return;
            try {
                const data = await watchmodeFetchJson('/genres/', {});
                const list = Array.isArray(data) ? data : (data.genres || []);
                if (!list.length) return;
                list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                list.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.id;
                    opt.textContent = g.name;
                    select.appendChild(opt);
                });
            } catch (e) { /* tür listesi opsiyonel, sessizce geç */ }
        }

        function recommendCardMarkup(item) {
            const isTv = (item.type || '').startsWith('tv');
            const year = item.year ? item.year : '';
            const posterInner = `<div class="poster-placeholder" data-poster-slot="${item.id}"><svg class="icon"><use href="#ic-film"/></svg></div>`;
            return `
                <div class="poster-card" data-wm-id="${item.id}" data-imdb-id="${item.imdb_id || ''}" data-title="${escapeHtml(item.title || '')}" data-type="${isTv ? 'tv' : 'movie'}" tabindex="0" role="button" aria-label="${escapeHtml(item.title || '')}">
                    <div class="poster-img-wrap" id="rmPoster-${item.id}">
                        ${posterInner}
                        <span class="poster-badge ${isTv ? 'tv' : 'movie'}">${isTv ? 'DİZİ' : 'FİLM'}</span>
                        <div class="poster-play"><svg class="icon"><use href="#ic-play"/></svg></div>
                        <div class="poster-overlay">
                            <div class="poster-title">${escapeHtml(item.title || '')}</div>
                            <div class="poster-meta">${escapeHtml(String(year))}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadRecommendations(reset) {
            const grid = document.getElementById('recommendGrid');
            const loadMoreWrap = document.getElementById('recommendLoadMoreWrap');
            const loadMoreBtn = document.getElementById('recommendLoadMoreBtn');
            if (rmLoading) return;

            if (!getWatchmodeApiKey()) {
                grid.innerHTML = `<div class="recommend-status error">
                    Öneri getirmek için önce bir Watchmode API anahtarı girmelisiniz.<br>
                    <a href="#" id="rmInlineKeyLink">anahtar gir</a> ·
                    <a href="https://api.watchmode.com/requestApiKey" target="_blank" rel="noopener">ücretsiz anahtar al →</a>
                </div>`;
                const link = document.getElementById('rmInlineKeyLink');
                if (link) link.onclick = (e) => { e.preventDefault(); promptForWatchmodeApiKey(); loadRecommendations(true); };
                loadMoreWrap.style.display = 'none';
                return;
            }

            if (reset) {
                rmPage = 1;
                grid.innerHTML = `<div class="recommend-status"><svg class="icon"><use href="#ic-star"/></svg>Öneriler getiriliyor...</div>`;
            } else {
                loadMoreBtn.textContent = 'Yükleniyor...';
                loadMoreBtn.disabled = true;
            }

            rmLoading = true;
            const type = document.getElementById('rmType').value;
            const sort = document.getElementById('rmSort').value;
            const genre = document.getElementById('rmGenre').value;

            const params = { types: type, sort_by: sort, page: rmPage };
            if (genre) params.genres = genre;

            try {
                const data = await watchmodeFetchJson('/list-titles/', params);
                const titles = data.titles || [];
                rmTotalPages = data.total_pages || 1;

                if (reset) grid.innerHTML = '';
                if (titles.length === 0 && reset) {
                    grid.innerHTML = `<div class="recommend-status">Bu filtrelerle sonuç bulunamadı, farklı bir tür ya da sıralama deneyin.</div>`;
                } else {
                    titles.forEach(item => {
                        grid.insertAdjacentHTML('beforeend', recommendCardMarkup(item));
                    });
                    attachRecommendCardHandlers(titles);
                    lazyLoadRecommendPosters(titles);
                }

                loadMoreWrap.style.display = (rmPage < rmTotalPages) ? 'flex' : 'none';
            } catch (err) {
                if (err.noKey) return;
                if (err.invalidKey) {
                    grid.innerHTML = `<div class="recommend-status error">Watchmode API anahtarı geçersiz görünüyor. <a href="#" id="rmFixKeyLink">anahtarı düzelt</a></div>`;
                    const link = document.getElementById('rmFixKeyLink');
                    if (link) link.onclick = (e) => { e.preventDefault(); promptForWatchmodeApiKey(); };
                } else {
                    grid.innerHTML = `<div class="recommend-status error">Öneriler alınamadı, bağlantı sorunu olabilir. Birazdan tekrar deneyin.</div>`;
                }
                loadMoreWrap.style.display = 'none';
            } finally {
                rmLoading = false;
                loadMoreBtn.textContent = 'Daha Fazla Göster';
                loadMoreBtn.disabled = false;
            }
        }

        function attachRecommendCardHandlers(titles) {
            titles.forEach(item => {
                const card = document.querySelector(`.poster-card[data-wm-id="${item.id}"]`);
                if (!card) return;
                card.onclick = () => {
                    if (!item.imdb_id) {
                        alert('Bu içerik için IMDb ID bulunamadı, arama kısmından manuel eklemeyi deneyebilirsiniz.');
                        return;
                    }
                    document.getElementById('mName').value = item.title || '';
                    document.getElementById('mType').value = card.dataset.type;
                    document.getElementById('mId').value = item.imdb_id;
                    const posterImg = document.querySelector(`#rmPoster-${item.id} img`);
                    document.getElementById('mPoster').value = posterImg ? posterImg.src : '';
                    updateUI();
                    scrollToSection('heroSection');
                };
            });
        }

        // Poster resimlerini kartlar ekrana geldikten sonra OMDb üzerinden tek tek doldurur
        // (Watchmode liste uç noktası poster döndürmüyor, bu yüzden mevcut OMDb altyapısı kullanılıyor).
        function lazyLoadRecommendPosters(titles) {
            const withImdb = titles.filter(t => t.imdb_id);
            if (!withImdb.length) return;

            const slots = withImdb.map(t => document.getElementById(`rmPoster-${t.id}`)).filter(Boolean);
            const io = new IntersectionObserver((entries, observer) => {
                entries.forEach(async (entry) => {
                    if (!entry.isIntersecting) return;
                    observer.unobserve(entry.target);
                    const wmId = entry.target.id.replace('rmPoster-', '');
                    const item = withImdb.find(t => String(t.id) === wmId);
                    if (!item) return;
                    const poster = await fetchPosterForId(item.imdb_id);
                    if (!poster) return;
                    const placeholder = entry.target.querySelector('.poster-placeholder');
                    if (placeholder) {
                        const img = document.createElement('img');
                        img.src = poster; img.alt = ''; img.loading = 'lazy';
                        placeholder.replaceWith(img);
                    }
                });
            }, { rootMargin: '200px' });

            slots.forEach(s => io.observe(s));
        }

        document.getElementById('recommendLoadMoreBtn').addEventListener('click', () => {
            rmPage += 1;
            loadRecommendations(false);
        });
    </script>
</body>
